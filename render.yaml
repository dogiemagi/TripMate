services:
  - type: web
    name: voyage-ai-platform
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.2
      - key: GEMINI_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
